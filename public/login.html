<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MGF Barbearia</title>

    <link rel="stylesheet" href="/Css/login.css">
    <link rel="stylesheet" href="/Css/tema.css">

    <link
        href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">

</head>

<body>

    <div class="login">

        <h1>💈Barbearia MGF💈</h1>

        <form id="loginForm">

            <div class="input-box">

                <i class="bx bx-user"></i>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuário"
                    autocomplete="off"
                    required>

            </div>

            <div class="input-box">

                <i class="bx bx-lock-alt"></i>

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required>

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

    <script src="/JS/login.js"></script>

</body>

</html>
