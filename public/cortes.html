<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cortes | MGF Barbearia</title>

    <link
        rel="stylesheet"
        href="/Css/cortes.css">
    <link rel="stylesheet" href="/Css/tema.css">

</head>

<body>

<div class="cortes">

    <!-- ========================= -->
    <!-- FORMULÁRIO -->
    <!-- ========================= -->

    <form id="formCorte">

        <h1>Novo Corte</h1>

        <label for="cliente">
            Cliente
        </label>

        <input
            type="text"
            id="cliente"
            name="cliente"
            placeholder="Nome do Cliente"
            required
        >

        <label for="corte">
            Tipo de Corte
        </label>

        <select
            id="corte"
            name="corte"
            required
        >

            <option value="">
                Selecione
            </option>

            <option value="Degradê">
                Degradê
            </option>

            <option value="Social">
                Social
            </option>

            <option value="Americano">
                Americano
            </option>

            <option value="Navalhado">
                Navalhado
            </option>

            <option value="Barba">
                Barba
            </option>

            <option value="Corte + Barba">
                Corte + Barba
            </option>

        </select>

        <label for="valor">
            Valor (R$)
        </label>

        <input
            type="number"
            id="valor"
            name="valor"
            step="0.01"
            min="0"
            placeholder="0,00"
            required
        >

        <label for="pagamento">
            Forma de Pagamento
        </label>

        <select
            id="pagamento"
            name="pagamento"
            required
        >

            <option value="">
                Selecione
            </option>

            <option value="Pix">
                Pix
            </option>

            <option value="Dinheiro">
                Dinheiro
            </option>

            <option value="Cartão">
                Cartão
            </option>

        </select>

        <label for="observacao">
            Observações
        </label>

        <textarea
            id="observacao"
            name="observacao"
            rows="4"
            placeholder="Opcional"
        ></textarea>

        <button type="submit">
            Salvar Corte
        </button>

    </form>


    <!-- ========================= -->
    <!-- LISTA DE CORTES -->
    <!-- ========================= -->

    <section class="listaCortes">

        <h2>Cortes Cadastrados</h2>

        <div class="tabela">

            <table>

                <thead>

                    <tr>

                        <th>Cliente</th>

                        <th>Corte</th>

                        <th>Valor</th>

                        <th>Pagamento</th>

                        <th>Data</th>

                        <th>Hora</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaCortes">

                </tbody>

            </table>

        </div>

    </section>

</div>


<script src="/JS/cortes.js"></script>

</body>

</html>
